services:
  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    expose:
      - "2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jsonfrontend
      - healthz
    networks:
      - internal
    environment:
      - "DOMAIN=${DOMAIN:-http://localhost}"
    restart: unless-stopped

  rawdataforecaster:
    image: ${FORTI_REGISTRY:-ghcr.io/metno}/forti/rawdataforecaster:${FORTI_TAG:-latest}
    build:
      context: ..
      dockerfile: rawdataforecaster/build/package/Dockerfile
    expose:
      - "5052"
      - "8080"
    volumes:
      - ./rawdataforecaster.config.json:/config.json:ro
      - ${FORECAST_DATA_PATH:-../data/forecast}:/data/forecast:ro
    command: ["-config", "/config.json", "-serve-stats"]
    networks:
      - internal

  correctedforecaster:
    image: ${FORTI_REGISTRY:-ghcr.io/metno}/forti/correctedforecaster:${FORTI_TAG:-latest}
    build:
      context: ..
      dockerfile: correctedforecaster/build/package/Dockerfile
    profiles: ["corrected"]
    volumes:
      - ${TOPOGRAPHY_DATA_PATH:-../data/topography}:/data/topography:ro
    command:
      - "-upstream"
      - "rawdataforecaster:5052"
      - "-workdir"
      - "/data/topography"
    depends_on:
      - rawdataforecaster
    networks:
      - internal

  jsonfrontend:
    image: ${FORTI_REGISTRY:-ghcr.io/metno}/forti/jsonfrontend:${FORTI_TAG:-latest}
    build:
      context: ..
      dockerfile: jsonfrontend/build/package/Dockerfile
    expose:
      - "8080"
      - "9090"
    command:
      - "-upstream"
      - "${JSONFRONTEND_UPSTREAM:-rawdataforecaster:5052}"
    depends_on:
      - rawdataforecaster
    networks:
      - internal

  healthz:
    image: ${FORTI_REGISTRY:-ghcr.io/metno}/forti/healthz:${FORTI_TAG:-latest}
    build:
      context: ..
      dockerfile: healthz/build/package/Dockerfile
    expose:
      - "8080"
    volumes:
      - ./healthz.config.json:/etc/forti/probes.json:ro
    depends_on:
      - jsonfrontend
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
